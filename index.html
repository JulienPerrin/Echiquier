<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%TITLE% | Echiquier</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a href="#moves-heading" class="skip-link visually-hidden">Skip to move history</a>
    <main class="layout">
      <div class="board-section">
        <header class="board-header">
          <h1 id="game-title">%TITLE%</h1>
          <p id="game-players" class="players">%PLAYERS%</p>
          <dl id="game-headers" class="game-headers" aria-label="Game headers"></dl>
        </header>
        <div class="board-container" role="group" aria-label="Chessboard position">
          <g-chess-board id="board" coordinates="outside"></g-chess-board>
        </div>
        <p id="move-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
        <pre
          class="fen-pre"
          tabindex="0"
          aria-label="Forsyth-Edwards Notation (FEN)"
        ><code id="api-status" class="fen-display"></code></pre>
      </div>

      <aside class="history-panel" aria-labelledby="moves-heading">
        <div class="history-header">
          <h2 id="moves-heading" tabindex="-1">Moves</h2>
          <div class="nav-controls" role="group" aria-label="Move navigation">
            <button id="prev-move" type="button" class="nav-btn" aria-disabled="true">
              <span aria-hidden="true">&#8592;</span>
              <span class="visually-hidden">Previous move</span>
            </button>
            <button id="next-move" type="button" class="nav-btn" aria-disabled="false">
              <span aria-hidden="true">&#8594;</span>
              <span class="visually-hidden">Next move</span>
            </button>
          </div>
        </div>
        <button id="start-pos-btn" type="button" class="start-pos-btn active" aria-pressed="true">Initial position</button>
        <div class="moves-scroll-container">
          <ol id="moves-list" class="moves-list" role="list" aria-labelledby="moves-heading"></ol>
          <div id="game-result-container" class="game-result-container" role="status" aria-label="Game result"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
