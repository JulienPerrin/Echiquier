<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%TITLE% | Echiquier</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a href="#moves-heading" class="skip-link visually-hidden">Skip to move history</a>
    <div class="app-shell">
      <div id="app-tablist" class="app-tablist" role="tablist" aria-label="Application views">
        <button id="app-tab-view" type="button" class="app-tab" role="tab" aria-selected="true" tabindex="0">View Games</button>
        <button id="app-tab-add" type="button" class="app-tab" role="tab" aria-selected="false" tabindex="-1">Add Game</button>
      </div>
      <div id="panel-view-game" role="tabpanel" aria-labelledby="app-tab-view">
        <main class="layout">
      <div class="board-section">
        <header class="board-header">
          <div class="game-selector-bar">
            <label for="game-select" class="game-select-label">Game:</label>
            <select id="game-select" class="game-select" name="game" aria-label="Select game to display">
              %GAME_OPTIONS%
            </select>
          </div>
          <h1 id="game-title">%TITLE%</h1>
          <p id="game-players" class="players">%PLAYERS%</p>
          <dl id="game-headers" class="game-headers" aria-label="Game headers"></dl>
        </header>
        <div class="board-container" role="group" aria-label="Chessboard position">
          <g-chess-board id="board" coordinates="outside"></g-chess-board>
        </div>
        <p id="move-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
      </div>

      <aside class="history-panel" aria-labelledby="moves-heading">
        <div class="history-header">
          <h2 id="moves-heading" tabindex="-1">Moves</h2>
          <div class="nav-controls" role="group" aria-label="Move navigation">
            <button id="prev-move" type="button" class="nav-btn" aria-disabled="true">
              <span aria-hidden="true">&#8592;</span>
              <span class="visually-hidden">Previous move</span>
            </button>
            <button id="next-move" type="button" class="nav-btn" aria-disabled="false">
              <span aria-hidden="true">&#8594;</span>
              <span class="visually-hidden">Next move</span>
            </button>
          </div>
        </div>
        <button id="start-pos-btn" type="button" class="start-pos-btn active" aria-pressed="true">Initial position</button>
        <div class="moves-scroll-container">
          <ol id="moves-list" class="moves-list" role="list" aria-labelledby="moves-heading"></ol>
          <div class="moves-footer">
            <div id="game-result-container" class="game-result-container" role="status" aria-label="Game result"></div>
            <button
              id="share-btn"
              type="button"
              class="share-btn"
              commandfor="share-dialog"
              command="show-modal"
              aria-haspopup="dialog"
              aria-label="Share game or position"
            >
              <span aria-hidden="true">&#x21aa;</span> Share
            </button>
          </div>
        </div>
      </aside>
    </main>
      </div>
      <div id="panel-add-game" role="tabpanel" aria-labelledby="app-tab-add" hidden>
        <form id="add-game-form" class="layout" aria-labelledby="add-game-heading">
          <h2 id="add-game-heading" class="visually-hidden">Add Past Game</h2>
          <div class="board-section">
            <header class="board-header">
              <div class="editable-title-row">
                <label for="add-header-title" class="visually-hidden">Title</label>
                <input id="add-header-title" name="title" type="text" class="editable-title" placeholder="Game Title" />
              </div>
              <div class="players editable-players">
                <label for="add-header-white" class="visually-hidden">White</label>
                <input id="add-header-white" name="white" type="text" class="editable-player" placeholder="White" />
                <span aria-hidden="true">vs</span>
                <label for="add-header-black" class="visually-hidden">Black</label>
                <input id="add-header-black" name="black" type="text" class="editable-player" placeholder="Black" />
              </div>
              <div class="game-headers editable-headers">
                <div class="header-item">
                  <label for="add-header-event">Event</label>
                  <input id="add-header-event" name="event" type="text" class="editable-tag" placeholder="Event" />
                </div>
                <div class="header-item">
                  <label for="add-header-site">Site</label>
                  <input id="add-header-site" name="site" type="text" class="editable-tag" placeholder="Site" />
                </div>
                <div class="header-item">
                  <label for="add-header-date">Date</label>
                  <input id="add-header-date" name="date" type="date" class="editable-tag editable-tag-date" />
                </div>
                <div class="header-item">
                  <label for="add-header-round">Round</label>
                  <input id="add-header-round" name="round" type="text" class="editable-tag editable-tag-short" />
                </div>
                <div class="header-item">
                  <label for="add-header-result">Result</label>
                  <select id="add-header-result" name="result" class="editable-result">
                    <option value="*">*</option>
                    <option value="1-0">1-0</option>
                    <option value="0-1">0-1</option>
                    <option value="1/2-1/2">1/2-1/2</option>
                  </select>
                </div>
              </div>
            </header>
            <div class="board-container" role="group" aria-label="Chessboard startup position">
              <g-chess-board id="add-game-board" coordinates="outside" interactive></g-chess-board>
            </div>
          </div>
          <aside class="history-panel" aria-labelledby="add-moves-heading">
            <div class="history-header">
              <h2 id="add-moves-heading" tabindex="-1">Moves</h2>
              <div class="nav-controls" role="group" aria-label="Move controls">
                <button id="add-undo-btn" type="button" class="nav-btn" aria-label="Undo last move" disabled>
                  <span aria-hidden="true">&#8592;</span>
                </button>
              </div>
            </div>
            <div class="moves-scroll-container">
              <div id="add-import-pgn-box" class="import-pgn-box" hidden>
                <label for="add-import-pgn-file" class="share-label">Upload .pgn file:</label>
                <input id="add-import-pgn-file" type="file" accept=".pgn,text/plain" class="import-pgn-file" />
                <label for="add-import-pgn-text" class="share-label">Or paste PGN:</label>
                <textarea id="add-import-pgn-text" class="share-textarea" rows="5" spellcheck="false"></textarea>
                <div class="import-pgn-actions">
                  <button id="add-import-pgn-submit" type="button" class="share-action-btn">Load PGN</button>
                  <button id="add-import-pgn-cancel" type="button" class="share-action-btn secondary">Cancel</button>
                </div>
              </div>
              <ol id="add-moves-list" class="moves-list" role="list" aria-labelledby="add-moves-heading"></ol>
              <div class="moves-footer">
                <button id="add-import-pgn-btn" type="button" class="share-btn">Import PGN</button>
                <button id="add-save-game-btn" type="submit" class="share-btn" hidden>Save Game</button>
              </div>
            </div>
          </aside>
        </form>
      </div>
    </div>

    <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-dialog-title">
      <div class="share-dialog-header">
        <h2 id="share-dialog-title">Share Game / Position</h2>
        <button id="close-share-dialog-btn" type="button" class="close-dialog-btn" aria-label="Close dialog">✕</button>
      </div>
      <div class="share-tabs" role="tablist" aria-label="Share format">
        <button id="tab-pgn" role="tab" type="button" class="share-tab active" aria-selected="true" aria-controls="panel-pgn">PGN (Full Game)</button>
        <button id="tab-fen" role="tab" type="button" class="share-tab" aria-selected="false" aria-controls="panel-fen">FEN (Current Position)</button>
      </div>
      <div id="panel-pgn" role="tabpanel" class="share-panel active" aria-labelledby="tab-pgn">
        <label for="share-pgn-text" class="share-label">Full game PGN:</label>
        <textarea id="share-pgn-text" class="share-textarea" readonly rows="8" spellcheck="false"></textarea>
        <div class="share-actions">
          <button id="dialog-copy-pgn-btn" type="button" class="share-action-btn">Copy PGN</button>
          <button id="dialog-download-pgn-btn" type="button" class="share-action-btn secondary">Download .pgn</button>
        </div>
      </div>
      <div id="panel-fen" role="tabpanel" class="share-panel" aria-labelledby="tab-fen" hidden>
        <label for="share-fen-text" class="share-label">Current position FEN:</label>
        <textarea id="share-fen-text" class="share-textarea" readonly rows="3" spellcheck="false"></textarea>
        <div class="share-actions">
          <button id="dialog-copy-fen-btn" type="button" class="share-action-btn">Copy FEN</button>
        </div>
      </div>
    </dialog>

    <div id="global-toast" class="global-toast" popover="manual" role="status" aria-live="polite">
      <span id="toast-message" class="toast-message"></span>
      <button id="toast-close-btn" type="button" class="toast-close-btn" aria-label="Close notification" popovertarget="global-toast" popovertargetaction="hide">✕</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
