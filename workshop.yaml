name: dev
base: ubuntu@26.04

sdks:
  # WARNING: Workshop containers get outbound internet access via the default workshopbr0 bridge.
  # Any tool or agent running inside (including rust/cargo, node/npm, or pi bash tools) can reach
  # the internet unless outbound traffic on workshopbr0 is blocked with nftables/ufw on the host.
  - name: rust
  - name: node
    channel: "24"
  - name: pi
    plugs:
      llm-endpoint:
        interface: tunnel
        endpoint: localhost:11434
      snap-endpoint:
        interface: tunnel
        endpoint: localhost:8400
      skills:
        interface: mount
        workshop-target: /home/workshop/.agents/skills
      rules:
        interface: mount
        workshop-target: /home/workshop/.agents/rules
  - name: system
    slots:
      llm-endpoint:
        interface: tunnel
        endpoint: localhost:11434
      snap-endpoint:
        interface: tunnel
        endpoint: localhost:8400

actions:
  pi: |
    mkdir -p ~/.pi/agent
    cat << 'JSON' > ~/.pi/agent/models.json
    {
      "providers": {
        "ollama-local": {
          "baseUrl": "http://localhost:11434/v1",
          "apiKey": "ollama",
          "api": "openai-completions",
          "models": [
            {
              "id": "mimo-256k:latest",
              "name": "MiMo V2.6 (256k)",
              "reasoning": true,
              "input": ["text"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 262144,
              "maxTokens": 32768
            }
          ]
        }
      }
    }
    JSON
    cat ~/.agents/rules/*.md > ~/.pi/agent/AGENTS.md 2>/dev/null || true
    exec pi "$@"

  mimo: |
    mkdir -p ~/.pi/agent
    cat << 'JSON' > ~/.pi/agent/models.json
    {
      "providers": {
        "mimo-snap": {
          "baseUrl": "http://localhost:8400/v1",
          "apiKey": "local",
          "api": "openai-completions",
          "models": [
            {
              "id": "mimo-v2.6-distill-qwen-9b",
              "name": "MiMo V2.6 Snap (256k)",
              "reasoning": true,
              "input": ["text"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 262144,
              "maxTokens": 32768
            }
          ]
        }
      }
    }
    JSON
    cat ~/.agents/rules/*.md > ~/.pi/agent/AGENTS.md 2>/dev/null || true
    exec pi "$@"
